<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Vibrant Indigo to Pink Gradient matching modern web design trends -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    
    <!-- Premium Dark Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>
  
  <!-- Outer container with rounded corners -->
  <rect width="512" height="512" rx="160" fill="url(#bg-grad)" />
  
  <!-- Stylized OD Monogram -->
  <g fill="none" stroke="url(#primary-grad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round">
    <!-- 'O' circle representing Olatunde -->
    <circle cx="206" cy="256" r="100" />
    
    <!-- 'D' shape representing Daniel, overlapping the 'O' for unity -->
    <path d="M 296 156 L 296 356 C 360 356, 406 311, 406 256 C 406 201, 360 156, 296 156 Z" fill="url(#primary-grad)" fill-opacity="0.1" />
  </g>
</svg>